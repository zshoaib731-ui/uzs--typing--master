!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastType UZS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>UZS Typing Master</h1>

    <div class="info">
        <div>
            <h3>Time</h3>
            <span id="time">60</span>
        </div>

        <div>
            <h3>WPM</h3>
            <span id="wpm">0</span>
        </div>

        <div>
            <h3>Accuracy</h3>
            <span id="accuracy">100%</span>
        </div>

        <div>
            <h3>Mistakes</h3>
            <span id="mistakes">0</span>
        </div>
    </div>


    <div class="text-box" id="textDisplay">
        The quick brown fox jumps over the lazy dog.
    </div>


    <textarea 
    id="inputText" 
    placeholder="Start typing here..."
    disabled></textarea>


    <button id="startBtn">
        Start Test
    </button>


    <button id="restartBtn">
        Restart
    </button>


</div>


<script src="script.js"></script>

</body>
</html>
